apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: microk8s-webapp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ralphbcab/microk8s-cicd-lab.git
    targetRevision: main
    path: kubernetes
  destination:
    server: https://kubernetes.default.svc
    namespace: cicd-lab
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
