apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  namespace: cicd-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
        - name: webapp
          image: ghcr.io/ralphbcab/microk8s-cicd-lab:22b8ea883a849fb4eec3de76bf7f01f5bb4d4cda
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
