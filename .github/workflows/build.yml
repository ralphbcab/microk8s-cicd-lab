
name: Build and Publish Container

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: |
            ghcr.io/ralphbcab/microk8s-cicd-lab:latest
            ghcr.io/ralphbcab/microk8s-cicd-lab:${{ github.sha }}

      - name: Update Kubernetes image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed -i \
            "s|image: ghcr.io/ralphbcab/microk8s-cicd-lab:.*|image: ghcr.io/ralphbcab/microk8s-cicd-lab:${IMAGE_TAG}|" \
            kubernetes/deployment.yaml

      - name: Commit updated deployment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add kubernetes/deployment.yaml

          if ! git diff --cached --quiet; then
            git commit -m "Deploy image ${{ github.sha }}"
            git push origin HEAD:main
          fi
